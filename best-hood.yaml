# Best / Broan-NuTone range hood — local Bluetooth control with an ESP32 (ESPHome)
# https://github.com/WheapLabs/esphome-best-hood   ·   License: MIT   ·   (c) 2026 WheapLabs
#
# Tested on: Best HBN1306SS (September 2026), HBN65366SS and WCS1306SS (October 2026),
# HBN542912SS (November 2026, fan_speeds and light_levels set to 8, see issue #12), one unit
# each. Other Best / Broan-NuTone hoods
# that use the "Best Kitchen" app may work — please report your model.
#
# How it works (protocol found by analysing the Best Kitchen app):
#   1. The hood stays invisible on Bluetooth until it hears a "wake-up" advertisement:
#      the ESP32 broadcasts it continuously (esp32_ble_server.manufacturer_data).
#   2. The ESP32 connects, then asks for encryption WITHOUT bonding (auth "no_bond",
#      Just Works). The hood drops the link if asked to store a bond, so encryption is
#      redone on every connection.
#   3. Values are ASCII digits in service ...20000:
#        fan        ...21001 state (0/1)   ...21005 speed (0 = off, 1 to fan_speeds)
#                   (...21017 instead of ...21005 on the HBN542912SS, see fan_speed_char)
#        light      ...21020 state (0/1)   ...21026 level (0 = off, 1 to light_levels)
#        SmartSense ...21040 (0/1)         delay-off ...21050 (0/1)
#      Writing a speed or a level turns it on; the hood notifies every change,
#      including changes made with its own buttons.
#
# Your secrets.yaml needs: wifi_ssid, wifi_password, best_hood_api_key, best_hood_ap_password

substitutions:
  # BLE MAC of YOUR hood: flash once, then read it in the logs (see README)
  hood_mac: "AA:BB:CC:DD:EE:FF"
  device_name: best-hood
  friendly_name: Best Hood
  svc: "47e36221-a32f-4980-bf17-341fd4f20000"
  base: "47e36221-a32f-4980-bf17-341fd4f"
  # Number of fan speeds and light levels of YOUR hood: 4 and 3 on most models,
  # 8 and 8 on the HBN542912SS (see README). Values are single digits (1 to 9).
  fan_speeds: "4"
  light_levels: "3"
  # Characteristic that holds the fan speed: 21005 on the 4-speed models, 21017 on the
  # HBN542912SS (8 speeds), which ignores writes to 21005. Chosen from fan_speeds; replace
  # the line with fan_speed_char: "21005" or "21017" if your hood behaves differently.
  fan_speed_char: ${ "21017" if fan_speeds | int > 4 else "21005" }
  # Light colour temperature and SmartSense options found on the HBN542912SS (issue #16):
  # "true" adds them to Home Assistant. Off by default, so other hoods are unchanged.
  extra_settings: "false"
  # Derived from extra_settings, do not edit. While it is off, the hidden extra entities point
  # at characteristics every hood has (model 11065, delay-off 21050) and never write them, so
  # hoods without these settings log no new warning.
  extras_on: ${ "true" if (extra_settings | string | lower) == "true" else "false" }
  extras_hidden: ${ "false" if extras_on == "true" else "true" }
  extras_poll: ${ "60s" if extras_on == "true" else "never" }

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      # ESP-IDF caches only 40 GATT characteristics by default and drops the rest silently.
      # Best hoods can have more (the HBN65366SS has 54, with 21026 and 21050 among the last).
      CONFIG_BT_GATTC_MAX_CACHE_CHAR: "100"

logger:
  level: INFO
  logs:
    esp32_ble_tracker: INFO
    sensor: INFO
    text_sensor: INFO
    component: INFO

api:
  encryption:
    key: !secret best_hood_api_key

# OTA updates are encrypted and authenticated with the API key.
ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot (if Wi-Fi is lost) — password protected.
  ap:
    ssid: "Best-Hood-Fallback"
    password: !secret best_hood_ap_password

captive_portal:

esp32_ble:
  io_capability: none
  auth_req_mode: no_bond
  max_notifications: 16

# "Wake-up" advertisement: company ID 22117 (0x5665, little-endian) followed by the
# 6 fixed bytes the Best Kitchen app broadcasts before connecting. Without it the
# hood stays invisible on Bluetooth.
esp32_ble_server:
  manufacturer_data: [0x65, 0x56, 0xE4, 0xD6, 0x14, 0x27, 0x35, 0x47]

esp32_ble_tracker:
  scan_parameters:
    active: true
  # Finds your hood's Bluetooth address: until the ESP32 is connected, every hood whose name
  # starts with "BEST" is logged at INFO, e.g. [hood] Found 'BEST HBN1306SS' at XX:XX:XX:XX:XX:XX.
  on_ble_advertise:
    - then:
        - lambda: |-
            if (id(hood).connected()) return;
            if (strncmp(x.get_name().c_str(), "BEST", 4) != 0) return;
            char mac[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
            ESP_LOGI("hood", "Found '%s' at %s (RSSI %d)",
                     x.get_name().c_str(), x.address_str_to(mac), x.get_rssi());

globals:
  # Last values reported by the hood; -1 = not received yet (nothing is written before that,
  # so an ESP32 reboot never switches the hood off).
  - id: r_fan_speed
    type: int
    restore_value: false
    initial_value: "-1"
  - id: r_light_level
    type: int
    restore_value: false
    initial_value: "-1"
  - id: r_smartsense
    type: bool
    restore_value: false
    initial_value: "false"
  - id: r_delay_off
    type: bool
    restore_value: false
    initial_value: "false"
  # Extra settings (extra_settings), -1 = not received yet.
  - id: r_color_temp
    type: int
    restore_value: false
    initial_value: "-1"
  - id: r_ss_mode
    type: int
    restore_value: false
    initial_value: "-1"
  - id: r_ss_sensitivity
    type: int
    restore_value: false
    initial_value: "-1"
  - id: r_ss_light
    type: int
    restore_value: false
    initial_value: "-1"
  - id: r_ss_light_delay
    type: int
    restore_value: false
    initial_value: "-1"

ble_client:
  - mac_address: ${hood_mac}
    id: hood
    auto_connect: true
    on_connect:
      then:
        - delay: 1s
        - lambda: |-
            esp_err_t err = id(hood).pair();
            ESP_LOGI("hood", "connected, encryption requested -> %d", err);
        # First read as soon as the link is encrypted (otherwise wait for the poll).
        - delay: 3s
        - component.update: t_fan_speed
        - component.update: t_light_level
        - component.update: t_smartsense
        - component.update: t_delay_off
        - component.update: t_model
        - lambda: |-
            if (!${extras_on}) return;
            id(t_color_temp).update();
            id(t_ss_mode).update();
            id(t_ss_sensitivity).update();
            id(t_ss_light).update();
            id(t_ss_light_delay).update();
    on_disconnect:
      then:
        - logger.log: "Hood disconnected"

script:
  # --- Writes to the hood (one ASCII digit) ---
  - id: write_fan_speed
    mode: queued
    parameters:
      n: int
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}${fan_speed_char}"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (48 + n)};'
  - id: write_fan_off
    mode: queued
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}21001"
          value: [0x30]
  - id: write_light_level
    mode: queued
    parameters:
      n: int
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}21026"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (48 + n)};'
  - id: write_light_off
    mode: queued
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}21020"
          value: [0x30]
  - id: write_smartsense
    mode: queued
    parameters:
      enabled: bool
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}21040"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (enabled ? 49 : 48)};'
  - id: write_delay_off
    mode: queued
    parameters:
      enabled: bool
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}21050"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (enabled ? 49 : 48)};'

  # --- Extra settings (extra_settings) ---
  - id: write_color_temp
    mode: queued
    parameters:
      n: int
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}${ '21090' if extras_on == 'true' else '21050' }"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (48 + n)};'
  - id: write_ss_mode
    mode: queued
    parameters:
      n: int
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}${ '21092' if extras_on == 'true' else '21050' }"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (48 + n)};'
  - id: write_ss_sensitivity
    mode: queued
    parameters:
      n: int
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}${ '21042' if extras_on == 'true' else '21050' }"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (48 + n)};'
  - id: write_ss_light
    mode: queued
    parameters:
      enabled: bool
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}${ '21094' if extras_on == 'true' else '21050' }"
          value: !lambda 'return std::vector<uint8_t>{(uint8_t) (enabled ? 49 : 48)};'
  # The light delay is sent in milliseconds, as ASCII digits ("60000" = 1 min).
  - id: write_ss_light_delay
    mode: queued
    parameters:
      minutes: int
    then:
      - ble_client.ble_write:
          id: hood
          service_uuid: "${svc}"
          characteristic_uuid: "${base}${ '21096' if extras_on == 'true' else '21050' }"
          value: !lambda |-
            std::string ms = std::to_string(minutes * 60000);
            return std::vector<uint8_t>(ms.begin(), ms.end());

  # --- HA -> hood: only writes when the request differs from what the hood reports ---
  - id: push_fan
    mode: restart
    then:
      - lambda: |-
          if (id(r_fan_speed) < 0 || !id(hood).connected()) return;
          int want = id(hood_fan).state ? id(hood_fan).speed : 0;
          if (id(hood_fan).state && want < 1) want = 1;
          if (want > ${fan_speeds}) want = ${fan_speeds};
          if (want == id(r_fan_speed)) return;
          ESP_LOGI("hood", "fan: %d -> %d", id(r_fan_speed), want);
          if (want == 0) id(write_fan_off).execute();
          else id(write_fan_speed).execute(want);

  # --- hood -> HA: align the entities with what the hood reports ---
  - id: sync_fan
    mode: restart
    then:
      - lambda: |-
          int s = id(r_fan_speed);
          if (s < 0) return;
          int cur = id(hood_fan).state ? id(hood_fan).speed : 0;
          if (cur == s) return;
          if (s == 0) { auto c = id(hood_fan).turn_off(); c.perform(); }
          else { auto c = id(hood_fan).turn_on(); c.set_speed(s); c.perform(); }
  - id: sync_light
    mode: restart
    then:
      - lambda: |-
          int l = id(r_light_level);
          if (l < 0) return;
          auto &v = id(hood_light).remote_values;
          int cur = v.is_on() ? (int) (v.get_brightness() * ${light_levels}.0f + 0.98f) : 0;
          if (cur > ${light_levels}) cur = ${light_levels};
          if (cur == l) return;
          if (l == 0) {
            auto c = id(hood_light).turn_off(); c.set_transition_length(0); c.perform();
          } else {
            auto c = id(hood_light).turn_on(); c.set_brightness(l / ${light_levels}.0f); c.set_transition_length(0); c.perform();
          }

  - id: sync_extras
    mode: restart
    then:
      - lambda: |-
          if (!${extras_on}) return;
          int ct = id(r_color_temp);
          if (ct >= 0 && id(hood_color_temp).state != ct) id(hood_color_temp).publish_state(ct);
          int d = id(r_ss_light_delay);
          if (d >= 1 && id(hood_ss_light_delay).state != d) id(hood_ss_light_delay).publish_state(d);
          int m = id(r_ss_mode);
          if (m >= 1 && m <= 2) {
            auto cur = id(hood_ss_mode).active_index();
            if (!cur.has_value() || *cur != (size_t) (m - 1)) id(hood_ss_mode).publish_state((size_t) (m - 1));
          }
          int sn = id(r_ss_sensitivity);
          if (sn >= 0 && sn <= 2) {
            auto cur = id(hood_ss_sensitivity).active_index();
            if (!cur.has_value() || *cur != (size_t) sn) id(hood_ss_sensitivity).publish_state((size_t) sn);
          }

fan:
  - platform: template
    id: hood_fan
    name: "Fan"
    speed_count: ${fan_speeds}
    restore_mode: ALWAYS_OFF
    on_state:
      - script.execute: push_fan

output:
  # Virtual output: converts brightness (0-1) into hood light level 0 to light_levels.
  - platform: template
    id: light_out
    type: float
    write_action:
      - lambda: |-
          if (id(r_light_level) < 0 || !id(hood).connected()) return;
          int want = state <= 0.0f ? 0 : (int) (state * ${light_levels}.0f + 0.98f);
          if (want > ${light_levels}) want = ${light_levels};
          if (want == id(r_light_level)) return;
          ESP_LOGI("hood", "light: %d -> %d", id(r_light_level), want);
          if (want == 0) id(write_light_off).execute();
          else id(write_light_level).execute(want);

light:
  - platform: monochromatic
    id: hood_light
    name: "Light"
    output: light_out
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

switch:
  # restore_mode DISABLED: never replay an action at boot (Bluetooth is not ready yet).
  - platform: template
    name: "SmartSense"
    icon: mdi:auto-mode
    restore_mode: DISABLED
    lambda: 'return id(r_smartsense);'
    turn_on_action:
      - script.execute:
          id: write_smartsense
          enabled: true
    turn_off_action:
      - script.execute:
          id: write_smartsense
          enabled: false
  - platform: template
    name: "Delay off"
    icon: mdi:fan-clock
    restore_mode: DISABLED
    lambda: 'return id(r_delay_off);'
    turn_on_action:
      - script.execute:
          id: write_delay_off
          enabled: true
    turn_off_action:
      - script.execute:
          id: write_delay_off
          enabled: false

  - platform: template
    name: "SmartSense light"
    icon: mdi:lightbulb-auto
    internal: ${extras_hidden}
    restore_mode: DISABLED
    lambda: 'return id(r_ss_light) == 1;'
    turn_on_action:
      - lambda: |-
          if (${extras_on} && id(r_ss_light) >= 0 && id(hood).connected()) id(write_ss_light).execute(true);
    turn_off_action:
      - lambda: |-
          if (${extras_on} && id(r_ss_light) >= 0 && id(hood).connected()) id(write_ss_light).execute(false);

number:
  # Extra settings (extra_settings); unknown until the hood reports them.
  - platform: template
    name: "Light colour temperature"
    id: hood_color_temp
    icon: mdi:thermometer
    internal: ${extras_hidden}
    min_value: 0
    max_value: 7
    step: 1
    mode: slider
    initial_value: nan
    optimistic: true
    set_action:
      - lambda: |-
          int v = (int) x;
          if (v < 0) v = 0;
          if (v > 7) v = 7;
          if (${extras_on} && id(r_color_temp) >= 0 && id(hood).connected() && v != id(r_color_temp))
            id(write_color_temp).execute(v);
  - platform: template
    name: "SmartSense light delay"
    id: hood_ss_light_delay
    icon: mdi:timer-outline
    internal: ${extras_hidden}
    unit_of_measurement: min
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    initial_value: nan
    optimistic: true
    set_action:
      - lambda: |-
          int v = (int) x;
          if (v < 1) v = 1;
          if (v > 10) v = 10;
          if (${extras_on} && id(r_ss_light_delay) >= 0 && id(hood).connected() && v != id(r_ss_light_delay))
            id(write_ss_light_delay).execute(v);

select:
  - platform: template
    name: "SmartSense mode"
    id: hood_ss_mode
    icon: mdi:auto-mode
    internal: ${extras_hidden}
    options:
      - "Heat only"
      - "Heat and air quality"
    optimistic: true
    set_action:
      - lambda: |-
          int v = x == "Heat only" ? 1 : 2;
          if (${extras_on} && id(r_ss_mode) >= 0 && id(hood).connected() && v != id(r_ss_mode))
            id(write_ss_mode).execute(v);
  - platform: template
    name: "SmartSense sensitivity"
    id: hood_ss_sensitivity
    icon: mdi:tune-variant
    internal: ${extras_hidden}
    options:
      - "Low"
      - "Medium"
      - "High"
    optimistic: true
    set_action:
      - lambda: |-
          int v = x == "Low" ? 0 : (x == "Medium" ? 1 : 2);
          if (${extras_on} && id(r_ss_sensitivity) >= 0 && id(hood).connected() && v != id(r_ss_sensitivity))
            id(write_ss_sensitivity).execute(v);

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
  - platform: template
    name: "Reconnect"
    entity_category: diagnostic
    on_press:
      - ble_client.disconnect: hood
      - delay: 3s
      - ble_client.connect: hood

binary_sensor:
  - platform: template
    name: "Bluetooth"
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(hood).connected() && id(r_fan_speed) >= 0;'

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  # Hood readings (internal): notified by the hood, plus a safety poll.
  - platform: ble_client
    ble_client_id: hood
    id: t_fan_speed
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}${fan_speed_char}"
    notify: true
    update_interval: 60s
    on_value:
      then:
        - lambda: |-
            if (x.empty() || x[0] < '0' || x[0] > '9') return;
            id(r_fan_speed) = x[0] - '0';
            id(sync_fan).execute();
  - platform: ble_client
    ble_client_id: hood
    id: t_light_level
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}21026"
    notify: true
    update_interval: 60s
    on_value:
      then:
        - lambda: |-
            if (x.empty() || x[0] < '0' || x[0] > '9') return;
            id(r_light_level) = x[0] - '0';
            id(sync_light).execute();
  - platform: ble_client
    ble_client_id: hood
    id: t_smartsense
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}21040"
    notify: true
    update_interval: 60s
    on_value:
      then:
        - lambda: |-
            if (x.empty()) return;
            id(r_smartsense) = x[0] == '1';
  - platform: ble_client
    ble_client_id: hood
    id: t_delay_off
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}21050"
    notify: true
    update_interval: 60s
    on_value:
      then:
        - lambda: |-
            if (x.empty()) return;
            id(r_delay_off) = x[0] == '1';
  - platform: ble_client
    ble_client_id: hood
    id: t_model
    name: "Model"
    service_uuid: "${svc}"
    characteristic_uuid: "${base}11065"
    update_interval: 3600s
    entity_category: diagnostic
  # Extra settings (extra_settings): read only while it is on.
  - platform: ble_client
    ble_client_id: hood
    id: t_color_temp
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}${ '21090' if extras_on == 'true' else '11065' }"
    notify: ${extras_on}
    update_interval: ${extras_poll}
    on_value:
      then:
        - lambda: |-
            if (!${extras_on}) return;
            if (x.empty() || x[0] < '0' || x[0] > '7') return;
            id(r_color_temp) = x[0] - '0';
            id(sync_extras).execute();
  - platform: ble_client
    ble_client_id: hood
    id: t_ss_mode
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}${ '21092' if extras_on == 'true' else '11065' }"
    notify: ${extras_on}
    update_interval: ${extras_poll}
    on_value:
      then:
        - lambda: |-
            if (!${extras_on}) return;
            if (x.empty() || x[0] < '1' || x[0] > '2') return;
            id(r_ss_mode) = x[0] - '0';
            id(sync_extras).execute();
  - platform: ble_client
    ble_client_id: hood
    id: t_ss_sensitivity
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}${ '21042' if extras_on == 'true' else '11065' }"
    notify: ${extras_on}
    update_interval: ${extras_poll}
    on_value:
      then:
        - lambda: |-
            if (!${extras_on}) return;
            if (x.empty() || x[0] < '0' || x[0] > '2') return;
            id(r_ss_sensitivity) = x[0] - '0';
            id(sync_extras).execute();
  - platform: ble_client
    ble_client_id: hood
    id: t_ss_light
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}${ '21094' if extras_on == 'true' else '11065' }"
    notify: ${extras_on}
    update_interval: ${extras_poll}
    on_value:
      then:
        - lambda: |-
            if (!${extras_on}) return;
            if (x.empty() || (x[0] != '0' && x[0] != '1')) return;
            id(r_ss_light) = x[0] - '0';
            id(sync_extras).execute();
  - platform: ble_client
    ble_client_id: hood
    id: t_ss_light_delay
    internal: true
    service_uuid: "${svc}"
    characteristic_uuid: "${base}${ '21096' if extras_on == 'true' else '11065' }"
    notify: ${extras_on}
    update_interval: ${extras_poll}
    on_value:
      then:
        - lambda: |-
            if (!${extras_on}) return;
            int ms = atoi(x.c_str());
            if (ms < 60000 || ms > 600000) return;
            id(r_ss_light_delay) = ms / 60000;
            id(sync_extras).execute();
